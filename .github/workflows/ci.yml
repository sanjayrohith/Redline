name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: build
        run: make build

      - name: vet
        run: make vet

      - name: lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

      - name: test
        run: make test
